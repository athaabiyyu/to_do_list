name: digistore
description: Aplikasi manajemen toko dengan database lokal SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # sqflite: package utama untuk SQLite di Flutter
  sqflite: ^2.3.3

  # path: digunakan untuk menyusun path file database di storage ponsel
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/